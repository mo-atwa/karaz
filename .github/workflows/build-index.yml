name: تحديث فهرس المنتجات
on:
  push:
    paths:
      - "products/**/*.html"
      - "tools/build-index.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: بناء الفهرس
        run: python3 tools/build-index.py
      - name: حفظ التغييرات
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/products.js sitemap.xml
          git diff --cached --quiet || (git commit -m "تحديث فهرس المنتجات تلقائيًا" && git push)
